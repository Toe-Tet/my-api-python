[project]
name = "my-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "psycopg[binary]",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "sqlmodel>=0.0.47",
]

[project.scripts]
my-api = "app:main"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
